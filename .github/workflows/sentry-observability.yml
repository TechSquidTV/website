name: Sync Sentry observability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-observability-production
  cancel-in-progress: false

jobs:
  sync:
    name: Sync dashboard and alerts
    runs-on: ubuntu-latest
    environment: production
    env:
      SENTRY_ALERT_ACTIONS: ${{ vars.SENTRY_ALERT_ACTIONS }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7
      - name: Check observability configuration
        run: bash scripts/check-ci-environment.sh SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT SENTRY_ALERT_ACTIONS
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm sentry:sync
