name: Publish newsletter template

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-template-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: production
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check publishing configuration
        run: bash scripts/check-ci-environment.sh RESEND_API_KEY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - run: pnpm newsletter:publish
