name: Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      discussion_base_sha:
        description: Commit immediately before the publication being recovered
        required: false
        type: string

permissions:
  contents: read
  discussions: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack install
      - name: Install dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-validate-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            astro-validate-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Check formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm format:check
      - name: Lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm lint
      - name: Check unused code
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm knip
      - name: Check spelling
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm spellcheck
      - name: Unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm test
      - name: Type-check and build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm build

  deploy:
    name: Deploy
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: techsquidtv-production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      discussions: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Check deployment configuration
        run: bash scripts/check-ci-environment.sh CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - name: Prepare blog comment thread identities
        env:
          DISCUSSION_BASE_SHA: ${{ inputs.discussion_base_sha || github.event.before }}
        run: |
          base_sha="${DISCUSSION_BASE_SHA:-HEAD^}"
          pnpm discussions:prepare -- --base "$base_sha" --head HEAD
      - name: Commit blog comment thread identities
        id: prepared
        run: |
          if git diff --quiet -- src/content/blog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/blog
            git commit -m "chore(blog): initialize discussion threads"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Provision and synchronize blog Discussions
        env:
          DISCUSSION_BASE_SHA: ${{ inputs.discussion_base_sha || github.event.before }}
        run: |
          base_sha="${DISCUSSION_BASE_SHA:-HEAD^}"
          pnpm discussions:provision -- --base "$base_sha" --head HEAD
      - name: Commit GitHub Discussion links
        id: discussion_links
        run: |
          if git diff --quiet -- src/content/blog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/blog
            git commit -m "chore(blog): link GitHub discussions"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Record deploy revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.revision.outputs.sha }}
          restore-keys: |
            astro-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm check
      - name: Deploy validated site build
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
      - run: pnpm deploy:ops
      - name: Notify IndexNow
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm indexnow:submit --base "${GITHUB_EVENT_BEFORE:-HEAD^}" --head "${{ steps.revision.outputs.sha }}"
